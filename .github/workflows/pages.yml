name: Deploy Brawl Helper to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check recommendations.js
          node --check backend/sync-assets.js
          node --check preboot.js
          node --check cache-cleanup.js
          node --check detail-v3.js
          node --check ui-v2.js

      - name: Build local game assets
        run: node backend/sync-assets.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
