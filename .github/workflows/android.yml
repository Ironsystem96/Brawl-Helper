name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web bundle
        run: npm run mobile:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure installable release build
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          marker = "        signingConfig signingConfigs.debug"
          if marker not in s:
              s = s.replace(
                  "        minifyEnabled false\n",
                  "        minifyEnabled false\n        signingConfig signingConfigs.debug\n",
                  1
              )
          s = s.replace('versionName "1.0"', 'versionName "0.1.1"')
          s = s.replace("versionCode 1", "versionCode 1")
          p.write_text(s)
          PY

      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: brawl-helper-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brawl-helper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
