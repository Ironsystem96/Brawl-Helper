name: Review Brawl Helper Meta
on:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * *'
      timezone: 'Europe/Rome'
permissions:
  contents: write
concurrency:
  group: brawl-helper-meta-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deterministic meta review
        working-directory: backend
        run: node meta-review.js
      - name: Commit review report
        run: |
          git config user.name "brawl-helper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(meta): update review report"
          git push