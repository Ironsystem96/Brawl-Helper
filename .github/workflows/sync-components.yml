name: Sync Brawl Helper Components
on:
  push:
    paths:
      - 'backend/sync-components.js'
      - 'data/brawlers.json'
      - '.github/workflows/sync-components.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brawl-helper-components
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync component catalog
        working-directory: backend
        run: node sync-components.js
      - name: Validate component catalog
        run: node -e "const x=JSON.parse(require('fs').readFileSync('data/components.json','utf8')); if(!x.entries || Object.keys(x.entries).length<90) throw new Error('Component catalog incomplete'); console.log('Component catalog OK',Object.keys(x.entries).length)"
      - name: Commit component data
        id: commit
        run: |
          git config user.name "brawl-helper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/components.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore(components): sync gear overdrive buffie catalog"
          git fetch origin main
          git rebase origin/main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages