<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="description" content="Brawl Helper - companion non ufficiale per Brawl Stars">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Brawl Helper</title>
</head>
<body>
<div id="app"><div style="padding:24px;font-family:system-ui;color:#fff;background:#10131a;min-height:100vh">Brawl Helper<br><small>Caricamento…</small></div></div>
<script>
window.addEventListener('error',function(e){
  var app=document.getElementById('app');
  if(app && app.textContent.includes('Caricamento')){
    app.innerHTML='<div style="padding:24px;font-family:system-ui;color:#fff;background:#10131a;min-height:100vh"><h2>Errore di caricamento</h2><pre style="white-space:pre-wrap;color:#ff9b9b">'+String(e.message||e.error||'Errore JavaScript')+'</pre><p>Apri la console del browser se serve un dettaglio ulteriore.</p></div>';
  }
});
</script>
<script src="preboot.js?v=3"></script>
<script src="app.js?v=30"></script>
<script>
setTimeout(function(){
  var app=document.getElementById('app');
  if(app && app.textContent.includes('Caricamento…')){
    app.innerHTML='<div style="padding:24px;font-family:system-ui;color:#fff;background:#10131a;min-height:100vh"><h2>Brawl Helper non ha avviato il motore</h2><p>Il file JavaScript principale non è stato eseguito. Fai Ctrl+F5 e riprova.</p></div>';
  }
},5000);
</script>
</body>
</html>
