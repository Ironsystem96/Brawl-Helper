<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf7ff">
<title>Brawl Helper V2</title>
<style>
html,body,#root{margin:0;min-height:100%;width:100%}
body{background:#07143b;color:#f7fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center}
#boot strong{display:block;font-size:20px}#boot span{display:block;margin-top:6px;font-size:12px;opacity:.65}
</style>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){return r.unregister();}));
      }).catch(function(){});
    }
    if('caches' in window){
      caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){return caches.delete(k);}));
      }).catch(function(){});
    }
  }catch(e){}
})();
</script>
</head>
<body>
<div id="root"><div id="boot"><div><strong>BRAWL HELPER V2</strong><span>Avvio interfaccia…</span></div></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
